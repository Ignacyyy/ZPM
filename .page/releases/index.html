<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="ZPM">
  <meta property="og:description" content="Modern package manager.">
  <meta property="og:image" content="https://github.com/Zielina-Konrad-productions/ZPM/blob/main/logo.png?raw=true">
  <meta name="theme-color" content="#4ade80">
  <link rel="icon" type="image/png" href="https://github.com/Zielina-Konrad-productions/ZPM/blob/main/logo.png?raw=true">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZPM – Releases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f0a;
      --surface: #111811;
      --surface2: #162016;
      --green: #4ade80;
      --green-dim: #22c55e;
      --green-dark: #16a34a;
      --green-glow: rgba(74,222,128,0.15);
      --green-glow-strong: rgba(74,222,128,0.3);
      --blue: #60a5fa;
      --blue-dim: #3b82f6;
      --blue-dark: #1d4ed8;
      --blue-glow: rgba(96,165,250,0.15);
      --blue-glow-strong: rgba(96,165,250,0.3);
      --text: #e2f5e2;
      --text-dim: #6b8f6b;
      --text-muted: #3a5c3a;
      --border: rgba(74,222,128,0.12);
      --border-bright: rgba(74,222,128,0.35);
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
      --accent: var(--green);
      --accent-dim: var(--green-dim);
      --accent-dark: var(--green-dark);
      --accent-glow: var(--green-glow);
      --accent-glow-strong: var(--green-glow-strong);
      --accent-border: rgba(74,222,128,0.35);
    }
    body.experimental {
      --accent: var(--blue);
      --accent-dim: var(--blue-dim);
      --accent-dark: var(--blue-dark);
      --accent-glow: var(--blue-glow);
      --accent-glow-strong: var(--blue-glow-strong);
      --accent-border: rgba(96,165,250,0.35);
      --bg: #0a0c14;
      --surface: #0e1220;
      --surface2: #121829;
      --text: #dde8f5;
      --text-dim: #6b80a8;
      --text-muted: #2e3f5c;
      --border: rgba(96,165,250,0.12);
      --border-bright: rgba(96,165,250,0.35);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:var(--mono);overflow-x:hidden;min-height:100vh;transition:background 0.5s ease,color 0.5s ease;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(74,222,128,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    body.experimental::before{background-image:linear-gradient(rgba(96,165,250,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,0.03) 1px,transparent 1px);}
    body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.05) 2px,rgba(0,0,0,0.05) 4px);pointer-events:none;z-index:0;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:20px 40px;background:rgba(10,15,10,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);transition:border-color 0.5s,background 0.5s;}
    body.experimental nav{background:rgba(10,12,20,0.8);}
    .nav-logo{font-family:var(--sans);font-weight:800;font-size:1.4rem;color:var(--accent);letter-spacing:-0.02em;text-decoration:none;transition:color 0.5s;}
    .nav-logo span{color:var(--text-dim);font-weight:400;font-size:0.85rem;margin-left:8px;vertical-align:middle;}
    .nav-links{display:flex;gap:32px;list-style:none;}
    .nav-links a{color:var(--text-dim);text-decoration:none;font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s;}
    .nav-links a:hover,.nav-links a.active{color:var(--accent);}
    .nav-github{display:flex;align-items:center;gap:8px;color:var(--accent);text-decoration:none;font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--accent-border);padding:8px 16px;transition:all 0.3s;}
    .nav-github:hover{background:var(--accent-glow);box-shadow:0 0 20px var(--accent-glow-strong);}
    .page{position:relative;z-index:1;padding:140px 40px 100px;max-width:1100px;margin:0 auto;}
    .page-label{font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:16px;display:flex;align-items:center;gap:12px;transition:color 0.5s;}
    .page-label::after{content:'';flex:1;height:1px;background:var(--border);max-width:200px;transition:background 0.5s;}
    .page-title{font-family:var(--sans);font-size:clamp(2rem,5vw,3.5rem);font-weight:800;letter-spacing:-0.04em;line-height:0.95;color:var(--text);margin-bottom:12px;}
    .page-title .accent{color:var(--accent);transition:color 0.5s;}
    .page-desc{color:var(--text-dim);font-size:0.9rem;line-height:1.7;max-width:480px;margin-bottom:56px;}
    .toggle-wrap{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;margin-bottom:64px;}
    .toggle-tabs{display:flex;}
    .toggle-tab{background:none;border:none;font-family:var(--mono);font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;padding:10px 28px;color:var(--text-muted);transition:color 0.3s;}
    .toggle-tab.active-release{color:var(--green);}
    .toggle-tab.active-experimental{color:var(--blue);}
    .toggle-track{position:relative;height:2px;width:100%;background:var(--border);transition:background 0.5s;}
    .toggle-line{position:absolute;top:0;left:0;height:2px;width:50%;background:var(--green);transition:left 0.35s cubic-bezier(0.4,0,0.2,1),background 0.35s ease;box-shadow:0 0 8px rgba(74,222,128,0.5);}
    .toggle-line.on-experimental{left:50%;background:var(--blue);box-shadow:0 0 8px rgba(96,165,250,0.5);}
    .releases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);transition:border-color 0.5s,background 0.5s;}
    .release-card{background:var(--bg);padding:32px;position:relative;overflow:hidden;transition:background 0.2s;display:flex;flex-direction:column;gap:16px;animation:fadeInUp 0.4s ease both;}
    .release-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:var(--accent);transition:height 0.3s ease,background 0.5s;}
    .release-card:hover{background:var(--surface);}
    .release-card:hover::before{height:100%;}
    .release-card::after{content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity 0.3s,background 0.5s;}
    .release-card:hover::after{opacity:1;}
    .release-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
    .release-name{font-family:var(--sans);font-size:1.15rem;font-weight:700;color:var(--accent);letter-spacing:-0.02em;transition:color 0.5s;word-break:break-word;}
    .release-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;border:1px solid;white-space:nowrap;flex-shrink:0;}
    .badge-release{color:var(--green);border-color:rgba(74,222,128,0.4);background:rgba(74,222,128,0.06);}
    .badge-pre{color:var(--blue);border-color:rgba(96,165,250,0.4);background:rgba(96,165,250,0.06);}
    .badge-dot-sm{width:5px;height:5px;border-radius:50%;background:currentColor;}
    .release-date{font-size:0.68rem;color:var(--text-muted);letter-spacing:0.08em;}
    .release-assets{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
    .asset-link{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);text-decoration:none;font-size:0.73rem;transition:all 0.2s;word-break:break-all;}
    .asset-link:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-glow);}
    .asset-icon{font-size:0.9rem;flex-shrink:0;}
    .asset-size{margin-left:auto;font-size:0.62rem;color:var(--text-muted);white-space:nowrap;flex-shrink:0;}
    .release-gh-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;transition:color 0.2s;}
    .release-gh-link:hover{color:var(--accent);}
    .empty-state{grid-column:1/-1;padding:80px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;background:var(--bg);}
    .empty-icon{font-size:2.5rem;opacity:0.3;}
    .empty-title{font-family:var(--sans);font-size:1.2rem;font-weight:700;color:var(--text-dim);}
    .empty-desc{font-size:0.78rem;color:var(--text-muted);max-width:360px;line-height:1.7;}
    .loading-state{grid-column:1/-1;padding:80px 40px;display:flex;flex-direction:column;align-items:center;gap:20px;background:var(--bg);}
    .loading-bar{width:200px;height:2px;background:var(--border);position:relative;overflow:hidden;}
    .loading-bar::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:var(--accent);animation:shimmer 1.2s infinite ease-in-out;box-shadow:0 0 12px var(--accent-glow-strong);transition:background 0.5s;}
    .loading-text{font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:48px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;transition:border-color 0.5s;}
    .footer-left .logo{font-family:var(--sans);font-weight:800;font-size:1.2rem;color:var(--accent);margin-bottom:8px;transition:color 0.5s;}
    .footer-left p{font-size:0.72rem;color:var(--text-muted);letter-spacing:0.06em;}
    .footer-right{display:flex;gap:32px;}
    .footer-right a{color:var(--text-dim);text-decoration:none;font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s;}
    .footer-right a:hover{color:var(--accent);}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    @keyframes shimmer{0%{left:-50%;}100%{left:100%;}}
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">ZPM <span id="nav-version">...</span></a>
  <ul class="nav-links">
    <li><a href="https://zielina.pl/">Home</a></li>
    <li><a href="https://zielina.pl/releases" class="active">Releases</a></li>
    <li><a href="https://zielina.pl/license">License</a></li>
  </ul>
  <a class="nav-github" href="https://github.com/Zielina-Konrad-productions/ZPM" target="_blank">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
    GitHub
  </a>
</nav>

<div class="page">
  <p class="page-label">ZPM Downloads</p>
  <h1 class="page-title">Releases.<br/><span class="accent">Download.</span></h1>
  <p class="page-desc">All versions of Zielina Package Manager. This is hobby project and may contain bugs. Pre-releases contain experimental features.</p>

  <div class="toggle-wrap">
    <div class="toggle-tabs">
      <button class="toggle-tab active-release" id="tab-release" onclick="switchMode('release')">Releases</button>
      <button class="toggle-tab" id="tab-experimental" onclick="switchMode('experimental')">Experimental</button>
    </div>
    <div class="toggle-track">
      <div class="toggle-line" id="toggle-line"></div>
    </div>
  </div>

  <div class="releases-grid" id="releases-grid">
    <div class="loading-state">
      <div class="loading-bar"></div>
      <p class="loading-text">Fetching releases...</p>
    </div>
  </div>
</div>

<footer>
  <div class="footer-left">
    <p class="logo">ZPM</p>
    <p>Zielina Package Manager &middot; MIT License &middot; <span class="dyn-version">...</span></p>
  </div>
  <div class="footer-right">
  </div>
</footer>

<script>
  const REPO = 'Zielina-Konrad-productions/ZPM';
  let allReleases = [];
  let mode = 'release';

  async function loadVersion() {
    try {
      const res = await fetch('https://raw.githubusercontent.com/' + REPO + '/main/VERSION.txt');
      if (!res.ok) throw new Error();
      const ver = (await res.text()).trim();
      const label = 'v' + ver;
      document.getElementById('nav-version').textContent = label;
      document.querySelectorAll('.dyn-version').forEach(el => el.textContent = label);
    } catch {
      document.getElementById('nav-version').textContent = 'v1.6';
      document.querySelectorAll('.dyn-version').forEach(el => el.textContent = 'v1.6');
    }
  }

  function switchMode(m) {
    mode = m;
    const line = document.getElementById('toggle-line');
    const tabR = document.getElementById('tab-release');
    const tabE = document.getElementById('tab-experimental');
    if (m === 'experimental') {
      document.body.classList.add('experimental');
      line.classList.add('on-experimental');
      tabR.className = 'toggle-tab';
      tabE.className = 'toggle-tab active-experimental';
    } else {
      document.body.classList.remove('experimental');
      line.classList.remove('on-experimental');
      tabR.className = 'toggle-tab active-release';
      tabE.className = 'toggle-tab';
    }
    renderReleases();
  }

  async function fetchReleases() {
    try {
      const res = await fetch('https://api.github.com/repos/' + REPO + '/releases?per_page=50');
      if (!res.ok) throw new Error('GitHub API error ' + res.status);
      allReleases = await res.json();
      renderReleases();
    } catch (e) {
      document.getElementById('releases-grid').innerHTML =
        '<div class="empty-state"><div class="empty-icon">&#9888;</div><p class="empty-title">Failed to load releases</p><p class="empty-desc">Could not reach GitHub API. <a href="https://github.com/' + REPO + '/releases" target="_blank" style="color:var(--accent)">View on GitHub &#8599;</a></p></div>';
    }
  }

  function renderReleases() {
    const grid = document.getElementById('releases-grid');
    const filtered = allReleases.filter(r => mode === 'experimental' ? r.prerelease === true : r.prerelease === false);
    if (filtered.length === 0) {
      const isExp = mode === 'experimental';
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">' + (isExp ? '&#128300;' : '&#128230;') + '</div><p class="empty-title">No ' + (isExp ? 'pre-releases' : 'releases') + ' yet</p><p class="empty-desc">' + (isExp ? 'There are no experimental pre-releases in this repository at the moment.' : 'No releases have been published yet. Check back soon.') + '</p><a href="https://github.com/' + REPO + '/releases" target="_blank" style="color:var(--accent);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;margin-top:8px;">View on GitHub &#8599;</a></div>';
      return;
    }
    grid.innerHTML = filtered.map(function(r, i) {
      var date = new Date(r.published_at).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
      var badge = r.prerelease
        ? '<span class="release-badge badge-pre"><span class="badge-dot-sm"></span>Pre-release</span>'
        : '<span class="release-badge badge-release"><span class="badge-dot-sm"></span>Release</span>';
      var assetLinks = r.assets && r.assets.length > 0
        ? r.assets.map(function(a) {
            return '<a class="asset-link" href="' + a.browser_download_url + '" target="_blank" rel="noopener noreferrer"><span class="asset-icon">' + getIcon(a.name) + '</span><span>' + escHtml(a.name) + '</span><span class="asset-size">' + formatSize(a.size) + '</span></a>';
          }).join('')
        : '';
      var sourceLinks = '<a class="asset-link" href="' + r.zipball_url + '" target="_blank" rel="noopener noreferrer"><span class="asset-icon">&#128374;</span><span>Source code (zip)</span><span class="asset-size"></span></a>'
        + '<a class="asset-link" href="' + r.tarball_url + '" target="_blank" rel="noopener noreferrer"><span class="asset-icon">&#128374;</span><span>Source code (tar.gz)</span><span class="asset-size"></span></a>';
      var assets = assetLinks + sourceLinks;
      return '<div class="release-card" style="animation-delay:' + (i * 0.06) + 's"><div class="release-header"><p class="release-name">' + escHtml(r.name || r.tag_name) + '</p>' + badge + '</div><p class="release-date">' + escHtml(r.tag_name) + ' &middot; ' + date + '</p><div class="release-assets">' + assets + '</div><a class="release-gh-link" href="' + r.html_url + '" target="_blank">View on GitHub &#8599;</a></div>';
    }).join('');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function getIcon(name) {
    if (name.endsWith('.deb')) return '&#128230;';
    if (name.endsWith('.tar.gz') || name.endsWith('.tar.xz') || name.endsWith('.zip')) return '&#128374;';
    if (name.endsWith('.sh')) return '&#9889;';
    return '&#11015;';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadVersion();
  fetchReleases();
</script>
</body>
</html>

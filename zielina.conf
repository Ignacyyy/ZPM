
# ─────────────────────────────────────────────────────────────────────────────
# ZPM Configuration File
# Location: /opt/ZPM/zielina.conf
# ─────────────────────────────────────────────────────────────────────────────

[core]
# Show update notifications in ZPM tools
# true  = show notifications when a new ZPM version is available
# false = silent mode, no update prompts
update-info=true

[UI-zhome]
# ── Default page ──────────────────────────────────────────────────────────────
# Controls which page is shown when running "zhome" with no arguments.
# RULES:
#   - Exactly ONE of the zhome-default-page-N options must be set to true
#   - All others must be false
#   - If zhome-show-all-pages=true, both below must be false
#
# PAGE 1 — ARM support and config information
zhome-default-page-1=true
# PAGE 2 — Commands, options and zpm wrapper info
zhome-default-page-2=false

# ── Show all pages ────────────────────────────────────────────────────────────
# Displays all pages at once when running "zhome"
# If set to true, zhome-default-page-1 and zhome-default-page-2 MUST be false
zhome-show-all-pages=false
